apiVersion: v1
kind: ConfigMap
metadata:
  name: add-config
  namespace: add
data:
  # Django
  DEBUG: "True"                      # POC — set "False" + real ALLOWED_HOSTS for prod
  # Auto-created admin on a fresh DB (password is in the Secret). Idempotent.
  DJANGO_SUPERUSER_USERNAME: "admin"
  DJANGO_SUPERUSER_EMAIL: "admin@example.com"
  # Internal service DNS (matches the Service names in this directory)
  REDIS_URL: "redis://add-redis:6379/0"
  QDRANT_HOST: "add-qdrant"
  QDRANT_PORT: "6333"
  QDRANT_SPEC_COLLECTION: "spec_embeddings"
  # LLM: on GKE use a managed model service (no Ollama container by default).
  #   "vertex" uses GKE Workload Identity (no key) — see the add-vertex SA.
  #   "claude" would instead need ANTHROPIC_API_KEY in the Secret.
  LLM_PROVIDER: "vertex"
  VERTEX_PROJECT: "ai-driven-development-503519"
  VERTEX_LOCATION: "us-central1"
  # Fallback model when no per-agent routing entry matches (see LLM_ROUTING_CONFIG).
  # To use CLAUDE via Vertex Model Garden: enable it, set VERTEX_LOCATION to a
  # region it offers (e.g. us-east5), and use vertex_ai/claude-3-5-sonnet-v2@20241022.
  VERTEX_MODEL: "vertex_ai/gemini-2.0-flash-001"
  # Per-agent routing: fast Gemini for spec/NLP, stronger model for code.
  # Remove this line to use the single VERTEX_MODEL for every agent.
  LLM_ROUTING_CONFIG: "config/llm_routing_vertex.yaml"
  # GitHub target (configurable per deployment)
  GITHUB_OWNER: "hubbridge-developer"
  CODE_REPO: "xspec-demo-app"
  SPEC_REPO_NAME: "xspec-specs"
  SPEC_REPO_URL: ""
  # Workflow tuning
  MAX_REVISION_CYCLES: "3"
  CODE_CONTEXT_MAX_CHARS: "4000"
  RUN_GENERATED_TESTS: "true"
  TEST_RUN_TIMEOUT: "180"
