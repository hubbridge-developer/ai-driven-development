apiVersion: v1
kind: Service
metadata:
  name: aidd-redis
  namespace: aidd
  labels: { app: aidd-redis }
spec:
  selector: { app: aidd-redis }
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidd-redis
  namespace: aidd
spec:
  replicas: 1
  selector:
    matchLabels: { app: aidd-redis }
  template:
    metadata:
      labels: { app: aidd-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
