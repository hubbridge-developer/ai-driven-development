# Frontend SPA. Uses the existing frontend image (vite) on 5173.
# For production, build a static image (node build -> nginx) and serve on 80;
# see k8s/README.md "Production hardening".
apiVersion: v1
kind: Service
metadata:
  name: add-frontend
  namespace: add
  labels: { app: add-frontend }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'   # container-native LB for GKE Ingress
spec:
  selector: { app: add-frontend }
  ports:
    - port: 5173
      targetPort: 5173
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: add-frontend
  namespace: add
spec:
  replicas: 1
  selector:
    matchLabels: { app: add-frontend }
  template:
    metadata:
      labels: { app: add-frontend }
    spec:
      containers:
        - name: frontend
          image: add-frontend:latest       # overridden by kustomization images:
          ports:
            - containerPort: 5173
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
