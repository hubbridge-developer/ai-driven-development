# Frontend SPA. Uses the existing frontend image (vite) on 5173.
# For production, build a static image (node build -> nginx) and serve on 80;
# see k8s/README.md "Production hardening".
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: add-frontend-backendconfig
  namespace: add
spec:
  # Raise the LB backend timeout well past the ~30s default so idle connections
  # (incl. Vite's HMR socket) aren't cut every 30s — the cut+reconnect is what
  # makes the dev server reload the whole page. Belt-and-suspenders with the
  # VITE_DISABLE_HMR env below.
  timeoutSec: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: add-frontend
  namespace: add
  labels: { app: add-frontend }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'   # container-native LB for GKE Ingress
    cloud.google.com/backend-config: '{"default": "add-frontend-backendconfig"}'
spec:
  selector: { app: add-frontend }
  ports:
    - port: 5173
      targetPort: 5173
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: add-frontend
  namespace: add
spec:
  replicas: 1
  selector:
    matchLabels: { app: add-frontend }
  template:
    metadata:
      labels: { app: add-frontend }
    spec:
      containers:
        - name: frontend
          image: add-frontend:latest       # overridden by kustomization images:
          env:
            # Disable Vite HMR behind the GCE LB so its ~30s idle cut doesn't
            # trigger a full-page reload every ~30 seconds. (Real fix: serve a
            # static nginx build — see README "Production hardening".)
            - name: VITE_DISABLE_HMR
              value: "1"
          ports:
            - containerPort: 5173
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
