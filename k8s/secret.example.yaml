# Template ONLY — do not commit real values. Copy to secret.yaml (gitignored),
# fill in, and `kubectl apply -f secret.yaml`. Values are plain strings under
# stringData (Kubernetes base64-encodes them for you).
apiVersion: v1
kind: Secret
metadata:
  name: aidd-secrets
  namespace: aidd
type: Opaque
stringData:
  # Django
  DJANGO_SECRET_KEY: "change-me-to-a-long-random-string"
  ENCRYPTION_KEY: ""                 # Fernet key if used
  # Database — password must match the postgres Secret below
  DATABASE_URL: "postgresql://aidd:CHANGE_ME@aidd-postgres:5432/aidd"
  POSTGRES_PASSWORD: "CHANGE_ME"
  # GitHub
  GITHUB_PAT: ""
  # LLM providers
  ANTHROPIC_API_KEY: ""             # required when LLM_PROVIDER=claude
