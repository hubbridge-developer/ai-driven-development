apiVersion: v1
kind: Service
metadata:
  name: aidd-postgres
  namespace: aidd
  labels: { app: aidd-postgres }
spec:
  selector: { app: aidd-postgres }
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None          # headless, for the StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aidd-postgres
  namespace: aidd
spec:
  serviceName: aidd-postgres
  replicas: 1
  selector:
    matchLabels: { app: aidd-postgres }
  template:
    metadata:
      labels: { app: aidd-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "aidd"
            - name: POSTGRES_DB
              value: "aidd"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aidd-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U aidd"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
