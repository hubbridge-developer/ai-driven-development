# GKE Ingress (GCE L7 load balancer).
#   /api /ws /admin /static -> backend  (add-api:8001)  [WebSockets supported]
#   /                        -> frontend (add-frontend:5173)
#
# For a custom domain + HTTPS, uncomment the ManagedCertificate block, point a
# DNS A record at the Ingress IP, and add the annotations noted below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: add-ingress
  namespace: add
  annotations:
    kubernetes.io/ingress.class: "gce"
    # --- HTTPS (optional) ---
    # networking.gke.io/managed-certificates: "add-cert"
    # kubernetes.io/ingress.global-static-ip-name: "add-ip"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: add-api
                port: { number: 8001 }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: add-api
                port: { number: 8001 }
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: add-api
                port: { number: 8001 }
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: add-api
                port: { number: 8001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: add-frontend
                port: { number: 5173 }
---
# Uncomment for managed HTTPS on a custom domain.
# apiVersion: networking.gke.io/v1
# kind: ManagedCertificate
