# GKE Ingress (GCE L7 load balancer).
#   /api  and /ws  -> backend  (aidd-api:8001)   [WebSockets supported natively]
#   /            -> frontend (aidd-frontend:5173)
#
# For a custom domain + HTTPS, uncomment the ManagedCertificate block, point a
# DNS A record at the Ingress IP, and add the annotations noted below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aidd-ingress
  namespace: aidd
  annotations:
    kubernetes.io/ingress.class: "gce"
    # --- HTTPS (optional) ---
    # networking.gke.io/managed-certificates: "aidd-cert"
    # kubernetes.io/ingress.global-static-ip-name: "aidd-ip"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aidd-api
                port: { number: 8001 }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: aidd-api
                port: { number: 8001 }
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: aidd-api
                port: { number: 8001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aidd-frontend
                port: { number: 5173 }
---
# Uncomment for managed HTTPS on a custom domain.
