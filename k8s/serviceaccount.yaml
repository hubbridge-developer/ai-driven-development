# Kubernetes ServiceAccount for the backend pod, bound (GKE Workload Identity)
# to the GCP service account Terraform creates. This is how the pod gets Vertex
# AI credentials with no key file. The annotation value MUST match
# google_service_account.vertex (add-vertex@<project>.iam.gserviceaccount.com).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: add-vertex
  namespace: add
  annotations:
    iam.gke.io/gcp-service-account: add-vertex@ai-driven-development-503519.iam.gserviceaccount.com
