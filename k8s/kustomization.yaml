apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: add

resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccount.yaml
  # secret.yaml is intentionally NOT listed — create it from secret.example.yaml
  # and apply separately so real credentials never live in version control:
  #   kubectl apply -f secret.yaml
  - postgres.yaml
  - redis.yaml
  - qdrant.yaml
  - qdrant-lb.yaml   # POC: public Qdrant dashboard (no auth) — remove for prod
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# Point these at your Artifact Registry images and immutable tags.
# Example registry: REGION-docker.pkg.dev/PROJECT_ID/add
images:
  - name: add-backend
    newName: REGION-docker.pkg.dev/PROJECT_ID/add/add-backend
    newTag: latest
  - name: add-frontend
    newName: REGION-docker.pkg.dev/PROJECT_ID/add/add-frontend
    newTag: latest
