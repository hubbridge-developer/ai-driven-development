apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aidd

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.yaml is intentionally NOT listed — create it from secret.example.yaml
  # and apply separately so real credentials never live in version control:
  #   kubectl apply -f secret.yaml
  - postgres.yaml
  - redis.yaml
  - qdrant.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# Point these at your Artifact Registry images and immutable tags.
# Example registry: REGION-docker.pkg.dev/PROJECT_ID/aidd
images:
  - name: aidd-backend
    newName: REGION-docker.pkg.dev/PROJECT_ID/aidd/aidd-backend
    newTag: latest
  - name: aidd-frontend
    newName: REGION-docker.pkg.dev/PROJECT_ID/aidd/aidd-frontend
    newTag: latest
