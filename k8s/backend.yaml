# Backend API (Django + Channels served by Daphne).
# Service is named "add-api" to match the frontend vite proxy and docker-compose.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: add-api-backendconfig
  namespace: add
spec:
  # Keep long-lived WebSocket connections (ws/workflow/{id}) from being cut by
  # the GCE L7 load balancer.
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
---
apiVersion: v1
kind: Service
metadata:
  name: add-api
  namespace: add
  labels: { app: add-api }
  annotations:
    cloud.google.com/backend-config: '{"default": "add-api-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'   # container-native LB for GKE Ingress
spec:
  selector: { app: add-api }
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: add-api
  namespace: add
spec:
  replicas: 1                        # scale >1 only after moving seeds to a Job
  selector:
    matchLabels: { app: add-api }
  template:
    metadata:
      labels: { app: add-api }
    spec:
      serviceAccountName: add-vertex   # GKE Workload Identity → Vertex AI creds
      # initContainer runs DB migrations + one-time seeds before Daphne starts.
      initContainers:
        - name: migrate-and-seed
          image: add-backend:latest      # overridden by kustomization images:
          command:
            - sh
            - -c
            - >
              python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              (python manage.py createsuperuser --noinput || true) &&
              python manage.py qdrant_create_collection &&
              python manage.py seed_namespaces &&
              python manage.py seed_spec_repo &&
              python manage.py seed_repositories
          envFrom:
            - configMapRef: { name: add-config }
            - secretRef: { name: add-secrets }
      containers:
        - name: api
          image: add-backend:latest        # overridden by kustomization images:
          command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "add_project.asgi:application"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: add-config }
            - secretRef: { name: add-secrets }
          readinessProbe:
            httpGet:
              path: /admin/login/     # returns 200 — used as the GCE backend health check
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }   # embedding model needs headroom
