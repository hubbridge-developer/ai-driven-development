apiVersion: v1
kind: Service
metadata:
  name: aidd-qdrant
  namespace: aidd
  labels: { app: aidd-qdrant }
spec:
  selector: { app: aidd-qdrant }
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aidd-qdrant
  namespace: aidd
spec:
  serviceName: aidd-qdrant
  replicas: 1
  selector:
    matchLabels: { app: aidd-qdrant }
  template:
    metadata:
      labels: { app: aidd-qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
            - containerPort: 6334
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
