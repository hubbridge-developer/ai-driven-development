# Per-agent routing for Google AI Studio's Gemini FREE tier.
# Same Gemini models as Vertex, but billed through a free (rate-limited) API key
# from https://aistudio.google.com — NOT your Vertex/GCP billing.
#
# Select it with:
#   LLM_PROVIDER=gemini
#   LLM_ROUTING_CONFIG=config/llm_routing_gemini_free.yaml
#   GEMINI_API_KEY=<key from aistudio.google.com>   (LiteLLM reads this env var)
#
# Difference from the Vertex file is ONLY the model prefix: `gemini/` instead of
# `vertex_ai/`. No project/region/Workload-Identity needed for the free tier.
#
# Free-tier notes: gemini-2.5-flash / flash-lite have generous free limits.
# gemini-2.5-pro's free tier is much stricter, so the code stage uses flash here
# to stay free during debug runs. Swap code_developer to gemini/gemini-2.5-pro if
# you want max quality and can accept the tighter free quota (or a small bill).

# --- Spec / NLP: fast + cheap ---
spec_discovery:
  model: gemini/gemini-2.5-flash
  max_tokens: 1024
  temperature: 0.0

spec_generation:
  model: gemini/gemini-2.5-flash
  max_tokens: 4096
  temperature: 0.2

spec_publisher:
  model: gemini/gemini-2.5-flash
  max_tokens: 512
  temperature: 0.0

namespace_resolver:
  model: gemini/gemini-2.5-flash
  max_tokens: 2048
  temperature: 0.1

# --- Code: kept on flash to stay in the free tier during debug ---
code_developer:
  model: gemini/gemini-2.5-flash
  max_tokens: 8192
  temperature: 0.2
