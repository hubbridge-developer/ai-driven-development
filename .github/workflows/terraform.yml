name: Terraform (GCP infra)

# Provisions/updates the GCP foundation in terraform/ (GKE, Artifact Registry,
# Workload Identity Federation, IAM). Keyless auth via WIF, remote state in GCS.
#
#   Pull request touching terraform/**  -> fmt + validate + plan (no changes)
#   Push to main touching terraform/**   -> plan + apply
#   Manual (workflow_dispatch)           -> plan + apply
#
# ── One-time bootstrap + required GitHub config: see terraform/README.md
#    "Deploy via GitHub Actions". The Terraform CI uses a *privileged* service
#    account (TF_SERVICE_ACCOUNT), distinct from the app-deploy one.
#
# ── Variables:  TF_STATE_BUCKET, GCP_PROJECT_ID, GCP_REGION
# ── Secrets:    TF_WIF_PROVIDER, TF_SERVICE_ACCOUNT

on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for Workload Identity Federation

env:
  # Terraform variables (non-secret) sourced from GitHub context + repo Variables
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_github_repo: ${{ github.event.repository.name }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TF_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (GCS backend)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=add/gke"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
